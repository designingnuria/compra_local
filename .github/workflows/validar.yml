name: Validar datos

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Comprobar sintaxis del JavaScript
        run: |
          node --check assets/js/app.js
          node --check data/negocios.js
      - name: Validar el directorio de negocios
        run: node scripts/validar.js
