# Despliega la analítica a Tinybird cuando cambia algo de tinybird/.
#
# En Tinybird Forward los recursos no se crean desde la interfaz: se declaran
# como archivos y nacen en el despliegue. Con esto el despliegue lo hace
# GitHub, así que no hace falta instalar nada en el ordenador de nadie.
#
# Hacen falta dos secretos del repositorio
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   TB_ADMIN_TOKEN   el "Workspace admin token" de Tinybird
#   TB_HOST          el API host de tu región, p. ej. https://api.tinybird.co
#
# El token de admin vive solo ahí: GitHub lo guarda cifrado, no se puede
# volver a leer una vez guardado y queda oculto en los registros.

name: Desplegar Tinybird

on:
  push:
    branches: [main]
    paths:
      - "tinybird/**"
      - ".github/workflows/tinybird.yml"
  workflow_dispatch: {}

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el CLI de Tinybird
        run: pip install --quiet tinybird

      - name: Comprobar el proyecto
        working-directory: tinybird
        env:
          TB_TOKEN: ${{ secrets.TB_ADMIN_TOKEN }}
          TB_HOST: ${{ secrets.TB_HOST }}
        run: tb --cloud deploy --check

      - name: Desplegar
        working-directory: tinybird
        env:
          TB_TOKEN: ${{ secrets.TB_ADMIN_TOKEN }}
          TB_HOST: ${{ secrets.TB_HOST }}
        run: tb --cloud deploy
