<!doctype html>
<!-- Plantilla de la imagen de previsualización (la que sale al compartir el
     enlace). Se abre a 1200x630 y se hace una captura; ver README.
     Usa Georgia a propósito y no la tipografía de la web: las imágenes se
     generan sin conexión y una fuente que no carga estropearía la captura. -->
<html lang="es"><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; display: flex; flex-direction: column;
    justify-content: center; padding: 0 88px;
    background:
      radial-gradient(900px 500px at 8% -20%, #F5E6DD, transparent 70%),
      #FBF9F5;
    font-family: Georgia, "Times New Roman", serif; color: #1C1A17;
  }
  .eyebrow {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 22px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: #B4552D; margin-bottom: 30px; white-space: nowrap;
  }
  h1 { font-size: 132px; line-height: .94; letter-spacing: -.025em; font-weight: 400; }
  h1 em { font-style: italic; color: #B4552D; }
  p {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 30px; line-height: 1.45; color: #6B6459;
    margin-top: 34px; max-width: 20ch;
  }
  .rule { width: 96px; height: 4px; background: #B4552D; margin-top: 44px; border-radius: 2px; }
</style></head><body>
  <p class="eyebrow" id="eyebrow">Madrid · 229 negocios</p>
  <h1>Consume <em>local</em></h1>
  <p>Tiendas y talleres independientes. Sin franquicias.</p>
  <div class="rule"></div>
</body></html>
